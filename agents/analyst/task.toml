# Stage 2b: the analyst. One claude-code run driving the analyst model reads one
# original task plus the customer model's rollout bundle for that task, and writes
# the short list of benchmark-level failure modes that becomes the hidden quality
# rubric.
version = "1.0"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
